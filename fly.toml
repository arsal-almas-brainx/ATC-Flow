# Fly.io deployment config. See README Part C.
#
# Rename `app` if "atc-flow-app" is already taken globally — and change
# SHOPIFY_APP_URL to match, since the hostname is derived from the app name.
app = "atc-flow-app"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

  # SQLite lives on the mounted volume below so it survives restarts and
  # redeploys. Losing it would log every shop out and force a reinstall.
  DATABASE_URL = "file:/data/prod.sqlite"

  # Not secrets: the client_id is public and the scopes are already in
  # shopify.app.toml. SHOPIFY_API_SECRET is set with `fly secrets set`.
  SHOPIFY_APP_URL = "https://atc-flow-app.fly.dev"
  SHOPIFY_API_KEY = "de8fdbefc8058f2b8e91a7750c7ded10"
  SCOPES = "read_products,unauthenticated_read_product_listings,unauthenticated_write_checkouts"

  # Failure screenshots from the browser-layer check, on the same persistent
  # volume as the database so they survive restarts.
  SCREENSHOT_DIR = "/data/screenshots"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true

  # The machine sleeps when idle and wakes on the first request, so an app only
  # you use costs cents a month. Cold start is a few seconds on the first load.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  # Bumped to 2048mb: every check is now browser-driven and one run holds
  # Chromium open for its entire duration (home -> product -> search -> cart
  # -> checkout -> collection), not just a couple of quick steps like the
  # previous 1024mb sizing assumed. A single Chromium instance alone can
  # already peak at 300-500MB; holding it open for a whole run's worth of
  # navigations, alongside the Node/Prisma process, needs real headroom.
  size = "shared-cpu-2x"
  memory = "2048mb"
