# Fly.io deployment config. See README "Deploy to Fly.io".
#
# Rename `app` if "atc-flow-app" is already taken globally.
app = "atc-flow-app"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

  # SQLite lives on the mounted volume below so it survives restarts and
  # redeploys. Losing it would lose every store's config and check history.
  DATABASE_URL = "file:/data/prod.sqlite"

  # Public URL, used for "view full report" links in Slack.
  APP_URL = "https://atc-flow-app.fly.dev"

  # ADMIN_PASSWORD, SESSION_SECRET and SLACK_BOT_TOKEN are secrets — set them
  # with `fly secrets set ADMIN_PASSWORD=... SESSION_SECRET=... SLACK_BOT_TOKEN=...`.

  # Failure screenshots from the browser-layer check, on the same persistent
  # volume as the database so they survive restarts.
  SCREENSHOT_DIR = "/data/screenshots"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true

  # Always on: scheduled checks and the daily screenshot cleanup run inside
  # this server, so a machine that sleeps when idle would miss them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  # Bumped to 2048mb: every check is now browser-driven and one run holds
  # Chromium open for its entire duration (home -> product -> search -> cart
  # -> checkout -> collection), not just a couple of quick steps like the
  # previous 1024mb sizing assumed. A single Chromium instance alone can
  # already peak at 300-500MB; holding it open for a whole run's worth of
  # navigations, alongside the Node/Prisma process, needs real headroom.
  size = "shared-cpu-2x"
  memory = "2048mb"
